<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>基站功能测试台 · Base Station Test Bench</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo">BS</div>
        <div>
          <h1>Base Station 功能测试台</h1>
          <p>每个功能都可单独点测，也可一键全测 · 主基站 :8080（无鉴权）/ 鉴权基站 :8081（jwt）</p>
        </div>
      </div>
      <div id="connection-panel" class="connection"></div>
    </header>

    <section class="bench-bar">
      <div class="bench-head">
        <h2>一键全测</h2>
        <p>按组依次执行全部功能用例（约 40 秒），每项给出通过/失败与实测证据。也可以在下方各分区里单独点测。</p>
      </div>
      <div class="bench-actions">
        <button class="primary" data-run-all>运行全部用例</button>
        <span class="bench-summary" data-bench-summary>尚未运行</span>
      </div>
      <ul class="bench-results" data-bench-results></ul>
    </section>

    <h2 class="section-title">一、基础通信</h2>
    <main class="grid">
      <section id="request-panel" class="panel"></section>
      <section id="metrics-panel" class="panel"></section>
      <section id="news-panel" class="panel"></section>
      <section id="traffic-log" class="panel panel--log"></section>
    </main>

    <h2 class="section-title">二、连接与会话</h2>
    <main class="grid">
      <section id="session-panel" class="panel"></section>
      <section id="registry-panel" class="panel"></section>
    </main>

    <h2 class="section-title">三、鉴权实验室（:8081 · jwt 模式）</h2>
    <main class="grid">
      <section id="auth-lab" class="panel panel--wide"></section>
    </main>

    <h2 class="section-title">四、标准组件（同一单例，四种用法）</h2>
    <main class="grid">
      <section id="component-panel" class="panel"></section>
      <section id="react-panel" class="panel"></section>
      <section id="vue-panel" class="panel"></section>
      <section id="shared-panel" class="panel"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
