<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基站图画书</title>
<style>
  :root {
    --ink: #241c14;
    --sky: #b9e3fb;
    --cream: #f6f0e4;
    --sun: #ffd36a;
    --blue: #2f6fed;
    --green: #2faf86;
    --orange: #ef7d4a;
    --paper: #fffdf8;
  }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--cream);
  }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .page {
    min-height: 100vh;
    min-height: 100dvh;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4vh 6vw 5vh;
    text-align: center;
  }
  .p1 { background: linear-gradient(#8fd4f8, #d9f1ff 55%, #c7e6a4); }
  .p2 { background: var(--cream); }
  .p3 { background: linear-gradient(#d7f0ff, #eef8e8); }
  .p4 { background: #fff3c4; }
  .p5 { background: #f4f7ff; }
  .p6 { background: #fff1ea; }
  .p7 { background: #e8f8f1; }
  .p8 { background: #fff6ea; }
  .p9 { background: #f3efff; }
  .pic {
    width: auto;
    height: min(58vh, 600px);
    max-width: 96vw;
    display: block;
  }
  h2 {
    margin: 1rem 0 0.25rem;
    font-size: clamp(2.7rem, 7vw, 5.4rem);
    line-height: 1;
    letter-spacing: -0.03em;
  }
  .line {
    margin: 0;
    max-width: 22em;
    font-size: clamp(1.25rem, 2.5vw, 1.85rem);
    font-weight: 700;
    line-height: 1.35;
  }
  .dots {
    position: fixed;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 9px;
    z-index: 4;
  }
  .dots a {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.22;
  }
  .dots a.on { opacity: 1; transform: scale(1.25); }
  .stage {
    width: min(960px, 96vw);
    height: min(42vh, 380px);
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(210px, 28vw) minmax(160px, 0.8fr);
    align-items: center;
    gap: 8px;
    position: relative;
    margin-top: 1vh;
  }
  .play-house, .play-tower {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .rooms {
    width: min(280px, 34vw);
    background: var(--paper);
    border: 6px solid var(--ink);
    border-radius: 22px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 10px 0 rgba(36, 28, 20, 0.08);
  }
  .rooms b {
    font-size: 0.95rem;
    letter-spacing: 0.08em;
  }
  .room {
    position: relative;
    border: 5px solid var(--ink);
    border-radius: 16px;
    min-height: 64px;
    display: grid;
    place-items: center;
    font-size: 1.45rem;
    font-weight: 800;
    background: #fff;
  }
  #room-news { background: #d9e6ff; }
  #room-metrics { background: #d7f6ea; }
  #room-ask { background: #ffe3d4; }
  .room.pop { animation: pop 0.45s ease; }
  .room[data-mail]::after {
    content: attr(data-mail);
    position: absolute;
    right: -10px;
    top: -12px;
    background: #fff;
    border: 4px solid var(--ink);
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    font-size: 0.95rem;
  }
  .cable {
    position: absolute;
    grid-column: 1 / -1;
    grid-row: 1;
    z-index: 0;
    height: 26px;
    margin: 0;
    background: var(--blue);
    border: 5px solid var(--ink);
    border-radius: 999px;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    transform: translateY(-50%);
  }
  .cable span { display: none; }
  .stage.cut .cable {
    background: transparent;
    border-color: transparent;
    height: 46px;
  }
  .stage.cut .cable span {
    display: block;
    width: 34px;
    height: 26px;
    background: #fff;
    border: 4px solid var(--ink);
    border-radius: 5px;
    box-shadow: inset -8px 0 0 #f6c1c1;
  }
  .play-tower svg { height: min(34vh, 300px); width: auto; }
  .packet {
    position: absolute;
    z-index: 3;
    min-width: 72px;
    padding: 0.35rem 0.7rem;
    border: 5px solid var(--ink);
    border-radius: 14px;
    font-size: 1.3rem;
    font-weight: 800;
    color: white;
    pointer-events: none;
    left: 0;
    top: 0;
  }
  .packet.news { background: var(--blue); }
  .packet.metrics { background: var(--green); }
  .packet.ask { background: var(--orange); }
  .stage.cut .packet { border-radius: 6px; box-shadow: inset -10px 0 0 rgba(255,255,255,0.35); }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 0.6rem;
  }
  button {
    font: inherit;
    font-weight: 800;
    font-size: 1.2rem;
    padding: 0.75rem 1.15rem;
    border-radius: 999px;
    border: 4px solid var(--ink);
    cursor: pointer;
    color: var(--ink);
    background: #fff;
  }
  button:focus-visible { outline: 4px solid var(--blue); outline-offset: 3px; }
  #send-news { background: #d9e6ff; }
  #send-metrics { background: #d7f6ea; }
  #ask { background: #ffe3d4; }
  #cut { background: #ffd6d6; }
  .say { min-height: 1.4em; }
  .wave { animation: pulse 2.4s ease-in-out infinite; }
  .wave.d { animation-delay: 0.6s; }
  .blink { animation: blink 1.6s steps(1) infinite; }
  @keyframes pulse {
    50% { opacity: 0.25; }
  }
  @keyframes blink {
    50% { fill: #fff2a8; }
  }
  @keyframes pop {
    40% { transform: scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave, .blink, .room.pop { animation: none; }
  }
  @media (max-width: 720px) {
    .dots { display: none; }
    .stage { grid-template-columns: 1fr; height: auto; gap: 14px; }
    .cable { position: static; transform: rotate(90deg); width: 90px; margin: 8px auto; grid-column: auto; grid-row: auto; }
    .rooms { width: min(420px, 90vw); }
  }
</style>
</head>
<body>
<svg class="sprite" aria-hidden="true">

    <circle cx="98" cy="230" r="6" fill="#241c14"/>
    <circle cx="142" cy="230" r="6" fill="#241c14"/>

<nav class="dots" aria-label="页">
  <a href="#p1"></a><a href="#p2"></a><a href="#p3"></a><a href="#p4"></a>
  <a href="#p5"></a><a href="#p6"></a><a href="#p7"></a><a href="#p8"></a><a href="#p9"></a>
</nav>

<section class="page p8" id="p8">

    <text x="700" y="400" text-anchor="middle" font-size="28" font-weight="800">页面</text>
    <g>
      <rect x="600" y="70" width="160" height="100" rx="24" fill="#d7f6ea" stroke="#241c14" stroke-width="7"/>
      <path d="M660 170 l10 36 -36 -16" fill="#d7f6ea" stroke="#241c14" stroke-width="7" stroke-linejoin="round"/>
      <text x="680" y="132" text-anchor="middle" font-size="44" font-weight="800">在</text>
    </g>
    <g>
      <circle cx="450" cy="430" r="70" fill="#fff" stroke="#241c14" stroke-width="7"/>
      <path d="M450 430 V385 M450 430 L490 450" stroke="#241c14" stroke-width="6" stroke-linecap="round"/>
      <text x="450" y="530" text-anchor="middle" font-size="26" font-weight="800">太久了，再问</text>
    </g>
  </svg>
  <h2>还在吗</h2>
  <p class="line">塔会问好。太久不答，就再问。</p>
</section>

<section class="page p9" id="p9">
  <div class="stage" id="stage">
    <div class="play-house">
      <div class="rooms">
        <b>这一页</b>
        <div class="room" id="room-news">公告</div>
        <div class="room" id="room-metrics">数字</div>
        <div class="room" id="room-ask">提问</div>
      </div>
    </div>
    <div class="cable" id="cable" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="play-tower" id="tower">
      <svg viewBox="0 0 240 360" aria-label="塔"><use href="#tower" width="240" height="360"/></svg>
    </div>
  </div>
  <p class="line say" id="say">点一个按钮。</p>
  <div class="controls">
    <button id="send-news" type="button">送公告</button>
    <button id="send-metrics" type="button">送数字</button>
    <button id="ask" type="button">问一句</button>
    <button id="cut" type="button">剪断快线</button>
  </div>
  <h2>你来送</h2>
</section>

<script>
  const pages = [...document.querySelectorAll(".page")];
  const links = [...document.querySelectorAll(".dots a")];
  const watch = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const id = "#" + entry.target.id;
      for (const link of links) link.classList.toggle("on", link.getAttribute("href") === id);
    }
  }, { threshold: 0.55 });
  for (const page of pages) watch.observe(page);

  const stage = document.querySelector("#stage");
  const say = document.querySelector("#say");
  const cutBtn = document.querySelector("#cut");
  const cable = document.querySelector("#cable");
  let busy = false;

  function placeCable() {
    if (window.matchMedia("(max-width: 720px)").matches) {
      cable.style.left = "";
      cable.style.width = "";
      cable.style.top = "";
      return;
    }
    const box = stage.getBoundingClientRect();
    const house = stage.querySelector(".rooms").getBoundingClientRect();
    const tower = stage.querySelector(".play-tower svg").getBoundingClientRect();
    const buildingLeft = tower.left + tower.width * (46 / 240);
    const left = house.right - box.left - 10;
    const width = Math.max(48, buildingLeft - house.right + 22);
    cable.style.left = left + "px";
    cable.style.width = width + "px";
    cable.style.top = (house.top + house.height / 2 - box.top) + "px";
  }
  placeCable();
  window.addEventListener("resize", placeCable);

  function point(sel) {
    const box = stage.getBoundingClientRect();
    const r = stage.querySelector(sel).getBoundingClientRect();
    return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2 };
  }

  function fly(el, from, to, ms) {
    el.style.left = from.x + "px";
    el.style.top = from.y + "px";
    const anim = el.animate(
      [
        { left: from.x + "px", top: from.y + "px", transform: "translate(-50%, -50%) scale(0.85)" },
        { left: to.x + "px", top: to.y + "px", transform: "translate(-50%, -50%) scale(1)" },
      ],
      { duration: ms, easing: "cubic-bezier(.2,.7,.2,1)", fill: "forwards" }
    );
    return anim.finished;
  }

  function makePacket(kind, text) {
    const el = document.createElement("div");
    el.className = "packet " + kind;
    el.textContent = text;
    stage.appendChild(el);
    return el;
  }

  async function deliver(room, kind, text) {
    if (busy) return;
    busy = true;
    const ms = stage.classList.contains("cut") ? 1100 : 700;
    const packet = makePacket(kind, text);
    await fly(packet, point("#tower"), point(room), ms);
    packet.remove();
    const node = stage.querySelector(room);
    node.dataset.mail = text;
    node.classList.remove("pop");
    void node.offsetWidth;
    node.classList.add("pop");
    say.textContent = stage.classList.contains("cut") ? "明信片送到了" : "送到了";
    busy = false;
  }

  document.querySelector("#send-news").addEventListener("click", () => deliver("#room-news", "news", "公告"));
  document.querySelector("#send-metrics").addEventListener("click", () => deliver("#room-metrics", "metrics", "数字"));
  document.querySelector("#ask").addEventListener("click", async () => {
    if (busy) return;
    busy = true;
    const ms = stage.classList.contains("cut") ? 1000 : 650;
    const q = makePacket("ask", "？");
    await fly(q, point("#room-ask"), point("#tower"), ms);
    q.remove();
    const a = makePacket("ask", "好");
    await fly(a, point("#tower"), point("#room-ask"), ms);
    a.remove();
    const node = stage.querySelector("#room-ask");
    node.dataset.mail = "好";
    node.classList.remove("pop");
    void node.offsetWidth;
    node.classList.add("pop");
    say.textContent = "塔回答了";
    busy = false;
  });
  cutBtn.addEventListener("click", () => {
    const cut = stage.classList.toggle("cut");
    cutBtn.textContent = cut ? "接回快线" : "剪断快线";
    say.textContent = cut ? "快线断了，改寄明信片" : "快线接上了";
  });
</script>
</body>
</html>
